# 直接部署：从 GHCR 拉取预构建镜像（镜像名全小写）
# 在 Dockge 里新建 Stack 时，可直接粘贴本文件内容
services:
  dockermanager:
    image: ghcr.io/forallcodesouls/dockermanager:dev
    container_name: dockermanager
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      TZ: Asia/Shanghai
      STACKS_DIR: /opt/stacks
      DATA_DIR: /app/data
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      AUTO_UPDATE: ${AUTO_UPDATE:-true}
      AUTO_UPDATE_APPLY: ${AUTO_UPDATE_APPLY:-true}
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-600}
      IMAGE_NAME: ${IMAGE_NAME:-ghcr.io/forallcodesouls/dockermanager:dev}
